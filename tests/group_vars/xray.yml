---

xray_docker_config:
  name: xray
  image: teddysun/xray
  tag: '{{ xray_version }}'
  path: '{{ docker_path }}/xray'
  restart_policy: '{{ docker_restart_policy }}'
  network_mode: host
  timezone: '{{ docker_timezone }}'

xray_server_config:
  name: '{{ inventory_hostname }}'
  tag: proxy
  listening_address: 0.0.0.0
  listening_port: 443
  public_address: '{{ ansible_host }}'
  vless_address: vk.com
  target_port: 443
  dns_port: 53
  flow: xtls-rprx-vision
  stream_settings:
    network: tcp
    security: reality
  outbounds:
    - protocol: freedom
      tag: direct
  routing:
    rules: []
  log:
    loglevel: warning

xray_clients_config:
  path: '{{ inventory_dir }}/files/clients/xray'
  clients:
    - router
    - smartphone
  outbounds:
    - protocol: vless
      tag: proxy
      settings:
        vnext:
          - address: '{{ ansible_host }}'
            port: 443
            users:
              - id: '{{ item.id | default("") }}'
                flow: xtls-rprx-vision
                encryption: none
      streamSettings:
        network: tcp
        security: reality
        realitySettings:
          serverName: vk.com
          fingerprint: chrome
          publicKey: '{{ xray_server_config.public_key | default("") }}'
          shortId: '{{ item.shortId | default("") }}'
    - protocol: freedom
      tag: direct
  routing:
    rules: []
  log:
    loglevel: warning
