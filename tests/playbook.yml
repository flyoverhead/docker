---

- name: deploy services
  hosts: docker
  gather_facts: true

  roles:

    # must run first: every other role reads docker_path, docker_network_mode,
    # docker_restart_policy and docker_timezone from its defaults, and the
    # community.docker modules need the engine and python3-requests in place
    - role: docker

    - role: node_exporter
      when: '"node_exporter" in group_names'

    - role: prometheus
      when: '"prometheus" in group_names'

    - role: alertmanager
      when: '"alertmanager" in group_names'

    - role: grafana
      when: '"grafana" in group_names'

    - role: dnscrypt
      when: '"dnscrypt" in group_names'

    - role: pihole
      when: '"pihole" in group_names'

    - role: singbox
      when: '"singbox" in group_names'

    - role: torrserver
      when: '"torrserver" in group_names'

    - role: xray
      when: '"xray" in group_names'
