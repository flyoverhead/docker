---

- name: update | pihole docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ pihole_docker_config.path }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
    lstrip_blocks: true
  changed_when: pihole_container_update
  notify:
    - pihole | recreate container
    - pihole | remove previous image
