---

- name: torrserver | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ torrserver_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (torrserver_container_exists | default(true)))

# An image or compose change needs `docker compose up` -- `restart` would keep
# running the old image forever. `pull: always` makes a moving tag resolve too.
- name: torrserver | recreate container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ torrserver_docker_config.path }}'
    state: present
    pull: always
    recreate: always
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (torrserver_container_exists | default(true)))

- name: torrserver | remove previous image
  become: true
  community.docker.docker_image_remove:
    name: '{{ torrserver_container.container.Image }}'
  register: torrserver_previous_image
  failed_when:
    - torrserver_previous_image is failed
    - "'is being used' not in (torrserver_previous_image.msg | default(''))"
    - "'referenced in multiple repositories' not in (torrserver_previous_image.msg | default(''))"
  when:
    - not ansible_check_mode
    - torrserver_container.exists
