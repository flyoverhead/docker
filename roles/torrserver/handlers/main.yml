---

- name: torrserver | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ torrserver_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60

# An image or compose change needs `docker compose up` -- `restart` would keep
# running the old image forever. `pull: always` makes a moving tag resolve too.
- name: torrserver | recreate container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ torrserver_docker_config.path }}'
    state: present
    pull: always
    recreate: always
    wait: true
    wait_timeout: 60
