---

- name: update | docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ xray_docker_config.path }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
    lstrip_blocks: true
  notify:
    - xray | kill container
    - xray | start container
