---

# Reset first: set_fact is host-scoped and survives loop iterations, so without
# this a client that carries its own id/shortId (and therefore skips the block
# below) would inherit the credentials generated for a previous client --
# handing two clients the same UUID.
- name: client | reset generated secrets
  ansible.builtin.set_fact:
    xray_generated_client_uuid: ''
    xray_generated_client_short_id: ''

- name: client | generate secrets
  when: >-
    item.id | default('') | length == 0
    or item.shortId | default('') | length == 0
  block:

    - name: client | generate uuid
      become: true
      community.docker.docker_container:
        name: '{{ xray_docker_config.name }}-runtime'
        image: '{{ xray_docker_config.image }}:{{ xray_docker_config.tag }}'
        cleanup: true
        command: xray uuid
        detach: false
      register: xray_client_uuid_output
      changed_when: true

    - name: client | set uuid fact
      ansible.builtin.set_fact:
        xray_generated_client_uuid: '{{ xray_client_uuid_output.container.Output | trim }}'

    - name: client | generate short id
      become: true
      community.docker.docker_container:
        name: '{{ xray_docker_config.name }}-runtime'
        image: '{{ xray_docker_config.image }}:{{ xray_docker_config.tag }}'
        cleanup: true
        command: openssl rand -hex 8
        detach: false
      register: xray_client_short_id_output
      changed_when: true

    - name: client | set short id fact
      ansible.builtin.set_fact:
        xray_generated_client_short_id: '{{ xray_client_short_id_output.container.Output | trim }}'

- name: client | set uuid and short id facts
  ansible.builtin.set_fact:
    xray_client_uuid: >-
      {{ xray_generated_client_uuid
      if xray_generated_client_uuid | default('') | length > 0
      else item.id | default('') }}
    xray_client_short_id: >-
      {{ xray_generated_client_short_id
      if xray_generated_client_short_id | default('') | length > 0
      else item.shortId | default('') }}

- name: client | add secrets to clients config
  ansible.builtin.set_fact:
    xray_add_clients: >-
      {{ xray_add_clients | default([]) +
      [item | combine({'id': xray_client_uuid,
      'shortId': xray_client_short_id})] }}
