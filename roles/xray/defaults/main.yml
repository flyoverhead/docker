---

# https://xtls.github.io/
# https://github.com/XTLS/Xray-core/tags
# https://hub.docker.com/r/teddysun/xray/tags

xray_docker_config:
  name: xray
  image: teddysun/xray
  tag: 26.3.23
  path: '{{ docker_path }}/xray'
  restart_policy: always
  network_mode: host
  timezone: Europe/Moscow

xray_server_config:
  name: '{{ inventory_hostname }}'
  tag: proxy
  listening_address: 0.0.0.0
  listening_port: 443
  public_address: '{{ ansible_host }}'
  vless_address: vk.com
  target_port: 443
  dns_port: 53
  flow: xtls-rprx-vision
  stream_settings:
    network: tcp
    security: reality
  # Reuse a previously generated REALITY key pair instead of generating a new
  # one. When both values are set, the `xray x25519` generation is skipped.
  # private_key: ''
  # public_key: ''
  dns:
    servers: []
      # - 1.1.1.1
      # - https://dns.google/dns-query
      # - address: 8.8.8.8
      #   domains:
      #     - geosite:google
      #   expectIPs:
      #     - geoip:google
    # queryStrategy: UseIP
  outbounds: []
    # - protocol: freedom
    #   tag: out-direct
  routing:
    rules: []
      # - type: field
      #   domain:
      #     - geosite:category-ads-all
      #   outboundTag: block
      # - type: field
      #   ip:
      #     - geoip:private
      #   outboundTag: direct
  log:
    loglevel: warning

xray_clients_config:
  path: '{{ inventory_dir }}/files/clients'
  clients:
    - android
    - iphone
    - macbook
    # A client may also be defined as a mapping to reuse previously generated
    # secrets. When both `id` and `shortId` are set, the `xray uuid` and
    # `openssl rand` generation is skipped for that client.
    # - email: keenetic
    #   id: 11111111-2222-3333-4444-555555555555
    #   shortId: 0123456789abcdef
  dns:
    servers: []
      # - 1.1.1.1
      # - https://dns.adguard-dns.com/dns-query
      # - address: 8.8.8.8
      #   domains:
      #     - geosite:geolocation-!cn
      #   expectIPs:
      #     - geoip:!ru
    # queryStrategy: UseIP
  inbounds: []
    # - protocol: socks
    #   tag: socks-in
    #   listen: 127.0.0.1
    #   port: 1080
    #   settings:
    #     udp: true
    # - protocol: http
    #   tag: http-in
    #   listen: 127.0.0.1
    #   port: 8080
  outbounds: []
    # - protocol: vless
    #   tag: proxy
    #   settings:
    #     vnext:
    #       - address: '{{ ansible_host }}'
    #         port: 443
    #         users:
    #           - id: '{{ item.id | default("") }}'
    #             flow: xtls-rprx-vision
    #             encryption: none
    #   streamSettings:
    #     network: tcp
    #     security: reality
    #     realitySettings:
    #       serverName: vk.com
    #       fingerprint: chrome
    #       publicKey: '{{ xray_server_config.public_key | default("") }}'
    #       shortId: '{{ item.shortId | default("") }}'
    # - protocol: freedom
    #   tag: direct
    # - protocol: blackhole
    #   tag: block
  routing:
    rules: []
      # - type: field
      #   domain:
      #     - geosite:category-ads-all
      #   outboundTag: block
      # - type: field
      #   ip:
      #     - geoip:private
      #   outboundTag: direct
  log:
    loglevel: warning

xray_tuning_config:
  enabled: false
  fs.file-max: 51200
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr
  net.core.rmem_max: 67108864
  net.core.wmem_max: 67108864
  net.core.netdev_max_backlog: 250000
  net.core.somaxconn: 4096
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_tw_reuse: 1
  net.ipv4.tcp_fin_timeout: 30
  net.ipv4.tcp_keepalive_time: 1200
  net.ipv4.ip_local_port_range: 10000 65000
  net.ipv4.tcp_keepalive_probes: 5
  net.ipv4.tcp_keepalive_intvl: 30
  net.ipv4.tcp_max_syn_backlog: 8192
  net.ipv4.tcp_max_tw_buckets: 5000
  net.ipv4.tcp_fastopen: 3
  net.ipv4.tcp_mem: 25600 51200 102400
  net.ipv4.udp_mem: 25600 51200 102400
  net.ipv4.tcp_rmem: 4096 87380 67108864
  net.ipv4.tcp_wmem: 4096 65536 67108864
  net.ipv4.tcp_mtu_probing: 1
  net.ipv4.tcp_slow_start_after_idle: 0
  system_limits:
    - limit: nofile
      domain: '*'
      types:
        - type: soft
          value: 51200
        - type: hard
          value: 51200

xray_force_update_secrets: false
