---

- name: xray | kill container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ xray_docker_config.path }}'
    remove_images: local
    state: absent
    wait: true
    wait_timeout: 60

- name: xray | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ xray_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60

# `state: present` with `recreate: always` rather than `state: restarted`: the
# latter maps to `docker compose restart`, which leaves the old container -- and
# therefore the old image and the old bind mounts -- in place.
- name: xray | restart container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ xray_docker_config.path }}'
    state: present
    recreate: always
    wait: true
    wait_timeout: 60
