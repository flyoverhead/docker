---

# `apply` is required on every include below, not optional: tags on a dynamic
# include_tasks decide only whether the include itself expands -- they are not
# pushed onto the included tasks. The included files carry no tags of their own,
# so without `apply` a tagged run would expand the include and then filter out
# everything inside it, reporting ok=1 changed=0 while doing nothing at all.
#
# `apply.tags` therefore mirrors `tags` exactly: whichever tag selected the
# include also matches the tasks that include pulled in.
- name: detect
  ansible.builtin.include_tasks:
    file: detect.yml
    apply:
      tags:
        - dnscrypt.config
        - dnscrypt.detect
        - dnscrypt.install
        - dnscrypt.update
  tags:
    - dnscrypt.config
    - dnscrypt.detect
    - dnscrypt.install
    - dnscrypt.update

- name: install
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags:
        - dnscrypt.install
  when:
    - not dnscrypt_container_exists
  tags:
    - dnscrypt.install

- name: update
  ansible.builtin.include_tasks:
    file: update.yml
    apply:
      tags:
        - dnscrypt.update
  when:
    - dnscrypt_container_update
  tags:
    - dnscrypt.update

- name: config
  ansible.builtin.include_tasks:
    file: config.yml
    apply:
      tags:
        - dnscrypt.config
  tags:
    - dnscrypt.config

- name: handlers
  ansible.builtin.meta: flush_handlers
