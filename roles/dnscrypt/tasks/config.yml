---

# avahi-daemon owns port 5353 (mDNS) on a stock Debian desktop install and would
# keep dnscrypt-proxy from binding it
- name: config | disable avahi systemd units
  become: true
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: stopped
    enabled: false
    masked: true
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  when:
    - dnscrypt_service_config.listening_port == 5353
    # service_facts only reports `.service` units, so the socket is gated on the
    # service being present -- they ship in the same package. Masking the socket
    # matters: left alone it would activate avahi again on the first mDNS packet.
    - '"avahi-daemon.service" in ansible_facts.services'

- name: config | dnscrypt blocklist
  become: true
  ansible.builtin.get_url:
    url: '{{ dnscrypt_service_config.blocked_names_url }}'
    dest: '{{ dnscrypt_docker_config.path }}/blocked-names.txt'
    owner: root
    group: root
    mode: '0644'
  when:
    - dnscrypt_service_config.blocked_names_url | default('') | length > 0

# cp, not mv: the file is bind-mounted and hot-reloaded, both of which follow the inode
- name: config | dnscrypt blocklist refresh job
  become: true
  ansible.builtin.cron:
    name: dnscrypt blocklist refresh
    user: root
    special_time: weekly
    job: >-
      curl -fsSL -o {{ dnscrypt_docker_config.path }}/blocked-names.txt.tmp
      '{{ dnscrypt_service_config.blocked_names_url | default('') }}'
      && test -s {{ dnscrypt_docker_config.path }}/blocked-names.txt.tmp
      && cp {{ dnscrypt_docker_config.path }}/blocked-names.txt.tmp
      {{ dnscrypt_docker_config.path }}/blocked-names.txt;
      rm -f {{ dnscrypt_docker_config.path }}/blocked-names.txt.tmp
    state: "{{ 'present' if dnscrypt_service_config.blocked_names_url | default('') | length > 0 else 'absent' }}"

- name: config | dnscrypt docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ dnscrypt_docker_config.path }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
    lstrip_blocks: true
  notify:
    - dnscrypt | recreate container

- name: config | dnscrypt configuration file
  become: true
  ansible.builtin.template:
    src: dnscrypt-proxy.toml.j2
    dest: '{{ dnscrypt_docker_config.path }}/dnscrypt-proxy.toml'
    owner: root
    group: root
    mode: '0644'
    backup: true
    lstrip_blocks: true
  notify:
    - dnscrypt | restart container
