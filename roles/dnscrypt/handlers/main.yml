---

# Every handler skips a check run of a first deployment: the compose project
# folder it points at has not been created.
- name: dnscrypt | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ dnscrypt_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (dnscrypt_container_exists | default(true)))

# `state: restarted` maps to `docker compose restart`: it reloads bind-mounted
# configuration without touching the image. Use it for config changes only.
- name: dnscrypt | restart container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ dnscrypt_docker_config.path }}'
    state: restarted
  when:
    - not (ansible_check_mode and not (dnscrypt_container_exists | default(true)))

# An image or compose change needs `docker compose up` -- `restart` would keep
# running the old image forever. `pull: always` makes a moving tag resolve too.
- name: dnscrypt | recreate container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ dnscrypt_docker_config.path }}'
    state: present
    pull: always
    recreate: always
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (dnscrypt_container_exists | default(true)))
