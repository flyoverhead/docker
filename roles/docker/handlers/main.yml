---

- name: docker | start service
  become: true
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: docker | restart service
  become: true
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    enabled: true

# group membership is only picked up by a new login session, so the persistent
# connection has to be dropped for the docker socket to be usable without sudo
- name: docker | reload groups
  ansible.builtin.meta: reset_connection
