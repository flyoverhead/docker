---

- name: install | clean unofficial packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-compose
      - docker-doc
      - docker.io
      - podman-docker
    state: absent
    autoremove: true
    purge: true

- name: install | keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: install | dependencies
  become: true
  ansible.builtin.apt:
    name: '{{ docker_repo.requirements }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: install | apt key
  become: true
  ansible.builtin.get_url:
    url: '{{ docker_repo.key }}'
    dest: /etc/apt/keyrings/docker
    owner: root
    group: root
    mode: '0644'
  register: docker_key_download
  until: docker_key_download is succeeded
  retries: 3
  delay: 5

- name: install | repository
  become: true
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/etc/apt/keyrings/docker] {{ docker_repo.url }}
    filename: docker
    state: present
    update_cache: true

- name: install | packages
  become: true
  ansible.builtin.apt:
    name: '{{ docker_repo.packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify:
    - docker | start service
