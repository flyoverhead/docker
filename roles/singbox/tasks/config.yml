---

- name: config | server tuning
  when:
    - singbox_tuning_config.enabled
  block:

    - name: config | kernel parameters
      become: true
      ansible.posix.sysctl:
        name: '{{ item.key }}'
        value: '{{ item.value }}'
        state: present
      loop: '{{ singbox_tuning_config | dict2items }}'
      loop_control:
        label: '{{ item.key }} is set to {{ item.value }}'
      when:
        - item.key not in ['enabled', 'system_limits']

    - name: config | nofile limits
      become: true
      community.general.pam_limits:
        domain: '{{ item.0.domain }}'
        limit_type: '{{ item.1.type }}'
        limit_item: '{{ item.0.limit }}'
        value: '{{ item.1.value }}'
      loop: >-
        {{ singbox_tuning_config.system_limits |
        subelements('types', skip_missing=true) }}
      loop_control:
        label: '{{ item.0.domain }} {{ item.1.type }} {{ item.0.limit }} {{ item.1.value }}'

- name: config | server secrets
  block:

    - name: config | generate server secrets
      ansible.builtin.include_tasks:
        file: server.yml
      when: >-
        not (singbox_server_config.private_key | default('') | length > 0
        and singbox_server_config.public_key | default('') | length > 0)
        and (not singbox_server_keys_exists or singbox_force_update_secrets)

    - name: config | add server keys to config
      ansible.builtin.set_fact:
        singbox_server_config: >-
          {{ singbox_server_config |
          combine({'private_key': singbox_private_key},
          {'public_key': singbox_public_key}) }}

- name: config | generate clients secrets
  block:

    - name: config | generate clients
      ansible.builtin.include_tasks:
        file: client.yml
      loop: '{{ singbox_new_clients | default([]) }}'
      loop_control:
        index_var: singbox_client
        label: '{{ item.name | default(item) }}'

    # Parenthesised deliberately: Jinja binds a filter tighter than '+', so
    # `a + b | sort` sorts only b and leaves the concatenation unordered.
    # Sorting the whole list keeps the rendered config.json stable regardless
    # of the order clients were detected or added in.
    #
    # One entry per name, last occurrence winning. `unique` keeps the first
    # match, so the list is reversed first: that makes a freshly issued
    # credential in singbox_add_clients beat the active one it replaces, which
    # is what singbox_force_update_secrets is for. Without this a reissued
    # client is appended rather than substituted, so the server keeps accepting
    # the old credential, the inbound doubles, and the two entries for one name
    # render to the same client profile path -- leaving that task reporting
    # changed on every run forever.
    - name: config | set singbox_all_clients fact
      ansible.builtin.set_fact:
        singbox_all_clients: >-
          {{ ((singbox_active_clients | default([]) |
          difference(singbox_inactive_clients | default([]))) +
          (singbox_add_clients | default([]))) | reverse | list |
          unique(attribute='name') | sort(attribute='name') }}

- name: config | create server configuration
  become: true
  ansible.builtin.template:
    src: server.j2
    dest: '{{ singbox_docker_config.path }}/config.json'
    owner: root
    group: root
    mode: '0600'
    # deliberately no `backup`: timestamped copies would pile up on the host,
    # each one holding a superseded REALITY private key and client UUIDs
    lstrip_blocks: true
  notify:
    - sing-box | restart container

- name: config | save public key
  become: true
  ansible.builtin.copy:
    content: '{{ singbox_server_config.public_key }}'
    dest: '{{ singbox_docker_config.path }}/public_key'
    owner: root
    group: root
    mode: '0644'

- name: config | create clients configuration folder
  delegate_to: localhost
  become: false
  ansible.builtin.file:
    path: '{{ singbox_clients_config.path }}'
    state: directory
    mode: '0700'

- name: config | create client configuration
  delegate_to: localhost
  become: false
  ansible.builtin.template:
    src: client.j2
    dest: '{{ singbox_clients_config.path }}/{{ singbox_server_config.name }}-{{ item.name }}.json'
    mode: '0600'
    lstrip_blocks: true
  loop: '{{ singbox_all_clients }}'
  loop_control:
    label: '{{ item.name }}'
