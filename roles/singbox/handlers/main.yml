---

- name: sing-box | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ singbox_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (singbox_container_exists | default(true)))

# An image or compose change needs `docker compose up` -- `restart` would keep
# running the old image forever. `pull: always` fetches the image while the old
# container still runs, so the outage is only the swap itself.
# async: when the controller's SSH rides this same proxy, stopping the container
# cuts the session; detached, the recreate still finishes and only polling fails.
- name: sing-box | recreate container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ singbox_docker_config.path }}'
    state: present
    pull: always
    recreate: always
    wait: true
    wait_timeout: 60
  async: 300
  poll: 5
  when:
    - not (ansible_check_mode and not (singbox_container_exists | default(true)))

# `recreate: always` rather than `state: restarted`: the latter maps to
# `docker compose restart`, which leaves the old container -- and therefore the
# old image -- in place. async as above.
- name: sing-box | restart container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ singbox_docker_config.path }}'
    state: present
    recreate: always
    wait: true
    wait_timeout: 60
  async: 300
  poll: 5
  when:
    - not (ansible_check_mode and not (singbox_container_exists | default(true)))
