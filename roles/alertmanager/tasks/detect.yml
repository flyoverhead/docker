---

- name: detect | alertmanager container
  become: true
  community.docker.docker_container_info:
    name: '{{ alertmanager_docker_config.name }}'
  register: alertmanager_container

- name: detect | set alertmanager_container_exists fact
  ansible.builtin.set_fact:
    alertmanager_container_exists: '{{ true if alertmanager_container.exists else false }}'

- name: detect | set alertmanager_container_update fact
  ansible.builtin.set_fact:
    alertmanager_container_update: >-
      {{ true if
      alertmanager_container.exists and
      alertmanager_docker_config.tag not in alertmanager_container.container.Config.Image
      else false }}
