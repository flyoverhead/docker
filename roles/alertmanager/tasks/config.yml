---

# without this silences and the notification log live inside the container and
# every image update loses them, re-notifying every already-silenced alert
- name: config | alertmanager data folder
  become: true
  ansible.builtin.file:
    path: '{{ alertmanager_docker_config.path }}/data'
    state: directory
    owner: '{{ alertmanager_service_config.uid }}'
    group: '{{ alertmanager_service_config.uid }}'
    mode: '0755'

- name: config | alertmanager configuration file
  become: true
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: '{{ alertmanager_docker_config.path }}/alertmanager.yml'
    owner: root
    group: root
    # world-readable on purpose: the prom/alertmanager image runs as `nobody`
    # and reads this bind mount. Keep receiver credentials in ansible-vault --
    # they are still in cleartext on the host once rendered.
    mode: '0644'
    backup: true
    lstrip_blocks: true
  notify:
    - alertmanager | restart container

- name: config | alertmanager message templates
  block:

    - name: config | alertmanager message templates folder
      become: true
      ansible.builtin.file:
        path: '{{ alertmanager_docker_config.path }}/templates'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: config | alertmanager message template files
      become: true
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ alertmanager_docker_config.path }}/templates/{{ item | basename }}'
        owner: root
        group: root
        mode: '0644'
      with_fileglob:
        - '*.tmpl'
      loop_control:
        label: '{{ item | basename }}'
      notify:
        - alertmanager | restart container
