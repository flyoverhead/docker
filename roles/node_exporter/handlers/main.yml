---

- name: node-exporter | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ node_exporter_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (node_exporter_container_exists | default(true)))

# An image or compose change needs `docker compose up` -- `restart` would keep
# running the old image forever. `pull: always` makes a moving tag resolve too.
- name: node-exporter | recreate container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ node_exporter_docker_config.path }}'
    state: present
    pull: always
    recreate: always
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (node_exporter_container_exists | default(true)))

- name: node-exporter | remove previous image
  become: true
  community.docker.docker_image_remove:
    name: '{{ node_exporter_container.container.Image }}'
  register: node_exporter_previous_image
  failed_when:
    - node_exporter_previous_image is failed
    - "'is being used' not in (node_exporter_previous_image.msg | default(''))"
    - "'referenced in multiple repositories' not in (node_exporter_previous_image.msg | default(''))"
  when:
    - not ansible_check_mode
    - node_exporter_container.exists
