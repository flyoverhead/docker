---

- name: update | node-exporter docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ node_exporter_docker_config.path }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
    lstrip_blocks: true
  changed_when: node_exporter_container_update
  notify:
    - node-exporter | recreate container
    - node-exporter | remove previous image
