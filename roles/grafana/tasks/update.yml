---

- name: update | grafana docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ grafana_docker_config.path }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
    lstrip_blocks: true
  changed_when: grafana_container_update
  notify:
    - grafana | recreate container
    - grafana | remove previous image
