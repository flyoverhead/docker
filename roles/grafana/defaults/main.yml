---

# https://grafana.com/oss/grafana/
# https://hub.docker.com/r/grafana/grafana/tags
#
# `grafana/grafana` is the OSS distribution. The `grafana/grafana-oss` mirror
# stopped receiving tags after 13.0.2, so this role tracks `grafana/grafana`.

grafana_docker_config:
  name: grafana
  image: grafana/grafana
  tag: 13.1.4
  path: '{{ docker_path }}/grafana'
  restart_policy: '{{ docker_restart_policy }}'
  network_mode: '{{ docker_network_mode }}'
  timezone: '{{ docker_timezone }}'

grafana_service_config:
  listening_port: 3000
  admin_username: grafana
  # override this -- the default is a placeholder, not a usable secret
  admin_password: grafana
  # uid/gid of the `grafana` user the image runs as; the data volume has to be
  # writable by it
  uid: 472

grafana_plugins:
  - grafana-clock-panel

# https://grafana.com/grafana/dashboards/
grafana_dashboards:
  - dashboard_id: 1860 # Node Exporter Full
    revision_id: 45
    name: node_exporter

grafana_source:
  name: prometheus
  type: prometheus
  url: http://{{ ansible_host }}
  port: '{{ prometheus_service_config.listening_port | default(9090) }}'
