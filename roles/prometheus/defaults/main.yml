---

# https://prometheus.io/
# https://hub.docker.com/r/prom/prometheus/tags

prometheus_docker_config:
  name: prometheus
  image: prom/prometheus
  tag: v3.14.0
  path: '{{ docker_path }}/prometheus'
  restart_policy: '{{ docker_restart_policy }}'
  network_mode: '{{ docker_network_mode }}'
  timezone: '{{ docker_timezone }}'

prometheus_service_config:
  listening_address: 0.0.0.0
  listening_port: 9090
  retention_time: 30d
  # uid/gid of the `nobody` user the prom/prometheus image runs as; the TSDB
  # volume has to be writable by it
  uid: 65534

# `command` replaces the image CMD outright, so the storage path has to be
# repeated here -- otherwise prometheus falls back to a relative `data/` and the
# TSDB lands outside the mounted volume
prometheus_command:
  - >-
    --web.listen-address={{ prometheus_service_config.listening_address
    }}:{{ prometheus_service_config.listening_port }}
  - --config.file=/etc/prometheus/prometheus.yml
  - --storage.tsdb.path=/prometheus
  - --storage.tsdb.retention.time={{ prometheus_service_config.retention_time }}

prometheus_global_config:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

prometheus_scrape_jobs:
  - job_name: alertmanager
    scrape_interval: 1m
    static_configs:
      - targets:
          - '{{ ansible_host }}:{{ alertmanager_service_config.listening_port }}'
        labels:
          instance: '{{ ansible_hostname }}'
  - job_name: node-exporter
    scrape_interval: 1m
    static_configs:
      - targets:
          - '{{ ansible_host }}:{{ node_exporter_service_config.listening_port }}'
        labels:
          instance: '{{ ansible_hostname }}'
  - job_name: prometheus
    scrape_interval: 1m
    static_configs:
      - targets:
          - '{{ ansible_host }}:{{ prometheus_service_config.listening_port }}'
        labels:
          instance: '{{ ansible_hostname }}'

prometheus_alert_jobs:
  - static_configs:
      - targets:
          - '{{ ansible_host }}:{{ alertmanager_service_config.listening_port }}'
        labels:
          instance: '{{ ansible_hostname }}'
