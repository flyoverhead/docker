---

- name: prometheus | start container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ prometheus_docker_config.path }}'
    state: present
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (prometheus_container_exists | default(true)))

# `state: restarted` maps to `docker compose restart`: it reloads bind-mounted
# configuration without touching the image. Use it for config changes only.
- name: prometheus | restart container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ prometheus_docker_config.path }}'
    state: restarted
  when:
    - not (ansible_check_mode and not (prometheus_container_exists | default(true)))

# An image or compose change needs `docker compose up` -- `restart` would keep
# running the old image forever. `pull: always` makes a moving tag resolve too.
- name: prometheus | recreate container
  become: true
  community.docker.docker_compose_v2:
    project_src: '{{ prometheus_docker_config.path }}'
    state: present
    pull: always
    recreate: always
    wait: true
    wait_timeout: 60
  when:
    - not (ansible_check_mode and not (prometheus_container_exists | default(true)))

- name: prometheus | remove previous image
  become: true
  community.docker.docker_image_remove:
    name: '{{ prometheus_container.container.Image }}'
  register: prometheus_previous_image
  failed_when:
    - prometheus_previous_image is failed
    - "'is being used' not in (prometheus_previous_image.msg | default(''))"
    - "'referenced in multiple repositories' not in (prometheus_previous_image.msg | default(''))"
  when:
    - not ansible_check_mode
    - prometheus_container.exists
